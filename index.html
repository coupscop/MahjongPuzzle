<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#1c584a"><title>麻将排序消除</title><link rel="stylesheet" href="style.css"></head><body><main id="app"><header><h1>麻将排序消除</h1><div id="status">请选择难度开始游戏</div></header><section id="menu"><h2>选择难度</h2><div id="modes"></div><div class="rules"><h3>游戏规则</h3><p>消除全部144张麻将牌即可获胜。初始18列，每列8张；只能操作各列顶部的牌。</p><p><b>数牌移动：</b>选顶部单张或同花色连续递减的数牌组，移至同花色、点数大1的牌上；空列只能放9开头的牌组。</p><p><b>配对消除：</b>相同字牌两张可消除；任意两张红花可配对，任意两张黑花也可配对。</p><p><b>选择消除：</b>从不同列选顶部数牌组，凑齐同花色1—9且不重复即可消除。</p><p><b>暂存：</b>3个暂存位，每格仅能放一张牌。</p></div></section><section id="game" hidden><div id="toolbar"></div><div id="info"></div><div id="board-wrap"><div id="board"></div></div><div id="hold-section"><div class="hold-label">暂存区</div><div id="holds"></div></div><div id="message" role="status"></div></section><div id="victory" hidden><div class="victory-panel"><h2>恭喜通关！</h2><p id="victory-moves"></p><button id="again">继续游戏</button><button id="back-menu">返回难度选择</button></div></div></main><script src="game.js"></script></body></html>
